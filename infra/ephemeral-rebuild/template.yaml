AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  WXYC monthly Discogs cache rebuild — ephemeral EC2. EventBridge schedule
  fires a launcher Lambda once per month; the Lambda calls RunInstances
  with a tiny user-data stub that clones discogs-etl and execs
  scripts/rebuild-cache-bootstrap.sh. The instance terminates itself via
  InstanceInitiatedShutdownBehavior=terminate when the bootstrap is done
  (or panics into trap EXIT). A second Lambda sweeps any rebuild instance
  still running >3h after launch as a failsafe.

Parameters:
  ScheduleExpression:
    Type: String
    Default: cron(0 6 4 * ? *)
    Description: >
      EventBridge schedule for the monthly rebuild. Default is 06:00 UTC on
      the 4th of each month (Discogs publishes the new dump on the 1st;
      a few days of slack lets the dump settle).

  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: >
      Whether the monthly rebuild schedule is armed. Set to DISABLED to stand
      the stack up without arming it — for a second copy in another account,
      a recovery deploy, or any window where a rebuild must not start on its
      own. The sweeper's hourly rule is deliberately NOT gated by this; it is
      the failsafe that cleans up a stuck instance, including a manually
      launched one.

      Do not reach for the `Enabled:` property on the Schedule event instead.
      SAM resolves `Enabled` at transform time in Python, so an intrinsic like
      `!Ref` is always truthy and the rule comes out armed regardless of the
      parameter value — silently, and `sam validate --lint` does not catch it.
      `State` is a PassThrough property and is the only spelling that works.
      The two are mutually exclusive. See #353.

  RepoBranch:
    Type: String
    Default: main
    Description: Branch of WXYC/discogs-etl the spawned instance clones.

  InstanceType:
    Type: String
    Default: c6i.large
    Description: >
      EC2 instance type. c6i.large (~$0.10/hr on-demand) is roughly 2x
      faster than t3.medium on the converter scan (CPU-bound) and the
      cargo build, at ~$0.06 marginal cost per monthly run (1.5 hr).
      Use t3.medium (~$0.04/hr) via --parameter-overrides for non-critical
      reruns where time matters less than cost.

  RootVolumeSizeGb:
    Type: Number
    Default: 100
    Description: >
      gp3 root volume size. The streaming dump is multi-tens-of-GB and
      filtered CSVs are ~5-10 GB; 100 GB clears the workload with
      headroom. EBS billed only for the ~90 min the instance exists.

  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: >
      AMI ID for the spawned instance. The default resolves to the latest
      Amazon Linux 2023 x86_64 image in this region via SSM Public
      Parameters; pin to a specific AMI ID if you need reproducibility
      across runs.

  MaxInstanceAgeHours:
    Type: Number
    Default: 3
    Description: >
      Sweeper failsafe. Any rebuild instance older than this is force-
      terminated and emits a StaleInstanceTerminated CloudWatch metric.

  AlertEmail:
    Type: String
    Default: ''
    Description: >
      Optional email subscribed to the alert SNS topic. Leave empty to
      manage subscriptions outside this stack (e.g., wire to a Slack
      webhook via a separate subscription).

  SsmPrefix:
    Type: String
    Default: /wxyc/discogs-rebuild
    Description: >
      SSM Parameter Store path prefix where the bootstrap reads
      DATABASE_URL_DISCOGS, GH_TOKEN, SLACK_MONITORING_WEBHOOK, and
      (optionally) SENTRY_DSN. SecureString parameters under this prefix
      are NOT created by this stack — provision them out-of-band via the
      AWS console or CLI before the first run (see infra/ephemeral-rebuild/README.md).

  ReleaseCountAlarmThreshold:
    Type: Number
    Default: 75000
    MinValue: 1
    Description: >
      Static floor for ReleaseCountAlarm (#358): the alarm fires when
      release_count (WXYC/DiscogsCache, published daily by sync-library.yml
      via scripts/cache_health_metrics.py) drops below this value.

      75000 is provisional. #358 specifies 0.5 x the trailing-90-day minimum
      of release_count, but the #353 account migration (closed 2026-08-05)
      moved the series to the org account with no history, so that minimum
      cannot be computed yet. The stand-in is pinned to the incident record
      in #358 instead: it sits above all three 2026 collapses (which bottomed
      at 39,005 / 39,724 / 50,135) and below the lowest healthy reading in
      that same series (106,977), so it catches the incident class without
      firing during the legitimate multi-day re-accretion that followed each
      one.

      When recomputing from real history, take the trailing-90-day minimum
      over *healthy* days only. Applied naively the formula disarms the
      alarm: any 90-day window containing a collapse has a minimum of ~39,005,
      and half of that (~19,500) sits below every cliff the alarm exists to
      catch. Exclude known-incident days — or use a low percentile of good
      days — then override via --parameter-overrides. Do not hand-edit
      ReleaseCountAlarm's Threshold instead.

      MinValue guards the other direction: release_count is never negative, so
      a 0 or negative override would make LessThanThreshold unsatisfiable and
      silently disable the alarm with no deploy error and no drift signal.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  # ------------------------------------------------------------------
  # Log archive bucket. Bootstrap's trap EXIT uploads the run log here
  # before shutdown. Lifecycle expires logs after 180 days.
  # ------------------------------------------------------------------
  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'wxyc-discogs-rebuild-logs-${AWS::AccountId}'
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-logs
            Status: Enabled
            ExpirationInDays: 180
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ------------------------------------------------------------------
  # Instance role + profile. Granted to the spawned EC2.
  # ------------------------------------------------------------------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      # AmazonSSMManagedInstanceCore lets the SSM Agent on the spawned
      # instance register with Systems Manager, which is what makes
      # `aws ssm start-session --target <i-...>` work for live debugging
      # mid-rebuild. Without it the instance is operator-blind for the
      # ~90 min rebuild window — see #170 (filed after the 2026-05-09 first
      # manual run, where the bootstrap died early and we couldn't tail
      # /var/log/cloud-init-bootstrap.log to diagnose).
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ssm-secrets-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*'
              # SecureString parameters use the default aws/ssm KMS CMK
              # for encryption; granting kms:Decrypt against any key with
              # the SSM service condition is the AWS-recommended scope.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
        - PolicyName: log-archive-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${LogBucket.Arn}/*'
        # ec2:DescribeInstances powers the bootstrap's concurrent-rebuild
        # guard (#311): before touching the shared cache it queries for peer
        # rebuild instances and self-terminates if it isn't the winning one.
        # Describe* has no resource-level scoping, so Resource must be '*'.
        # Still NO ec2 mutation grant — self-termination is `shutdown -h now`
        # (InstanceInitiatedShutdownBehavior=terminate releases the instance),
        # not ec2:TerminateInstances.
        - PolicyName: ec2-describe-for-collision-guard
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ------------------------------------------------------------------
  # Launch template. Pinning EBS, AMI, instance type, and shutdown
  # behaviour here means the launcher Lambda only has to pass user-data
  # + tags at run-time.
  # ------------------------------------------------------------------
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: discogs-rebuild
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        InstanceInitiatedShutdownBehavior: terminate
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref RootVolumeSizeGb
              VolumeType: gp3
              DeleteOnTermination: true
        MetadataOptions:
          HttpTokens: required  # IMDSv2 only
          HttpPutResponseHopLimit: 2
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Project
                Value: discogs-rebuild

  # ------------------------------------------------------------------
  # Launcher Lambda. EventBridge fires it on ScheduleExpression.
  # ------------------------------------------------------------------
  LauncherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: discogs-rebuild-launcher
      Description: Monthly trigger that calls RunInstances for the rebuild EC2.
      CodeUri: launcher/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          LAUNCH_TEMPLATE_ID: !Ref LaunchTemplate
          REPO_BRANCH: !Ref RepoBranch
          # The bootstrap reads REBUILD_LOG_BUCKET from env to know where
          # to upload its log archive + the S3 breadcrumb. Plumbed through
          # here so the launcher can inject `export REBUILD_LOG_BUCKET=...`
          # into the user-data stub. Without this both the breadcrumb
          # (#174) and the trap-EXIT upload (#173) silently no-op.
          LOG_BUCKET_NAME: !Ref LogBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: ec2:RunInstances
              Resource: '*'
            - Effect: Allow
              Action: ec2:DescribeInstances
              Resource: '*'
              # DescribeInstances backs the #304 collision precheck — the
              # launcher queries for an in-flight rebuild (Project=discogs-rebuild,
              # pending/running) before RunInstances and aborts if one exists.
              # Describe* has no resource-level scoping in IAM (it's '*'-only),
              # matching the sweeper role's grant.
            - Effect: Allow
              Action: ec2:CreateTags
              Resource: '*'
              # CreateTags is intentionally unrestricted: AWS evaluates this
              # implicitly during RunInstances when the request includes
              # TagSpecifications. The launcher needs the freedom to tag
              # any new resource RunInstances creates (instance + EBS volume).
            - Effect: Allow
              Action: iam:PassRole
              # PassRole is the only iam:* the launcher gets, and it's
              # scoped to the single role the launch template attaches.
              Resource: !GetAtt InstanceRole.Arn
            - Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: '*'
              # Emits LaunchCollisionAborted (#304) when the precheck suppresses
              # a colliding launch. Namespace-scoped like the sweeper's grant.
              Condition:
                StringEquals:
                  cloudwatch:namespace: WXYC/DiscogsRebuild
      Events:
        Monthly:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            # `State`, never `Enabled` — see the ScheduleState parameter.
            State: !Ref ScheduleState
            Description: Monthly Discogs cache rebuild.

  LauncherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${LauncherFunction}
      RetentionInDays: 30

  # ------------------------------------------------------------------
  # Sweeper Lambda. Hourly. Terminates rebuild EC2s older than the
  # MaxInstanceAgeHours threshold.
  # ------------------------------------------------------------------
  SweeperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: discogs-rebuild-sweeper
      Description: Failsafe — terminates rebuild EC2s past their wall-clock budget.
      CodeUri: sweeper/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 30
      Environment:
        Variables:
          MAX_INSTANCE_AGE_HOURS: !Ref MaxInstanceAgeHours
      Policies:
        - Statement:
            - Effect: Allow
              Action: ec2:DescribeInstances
              Resource: '*'
            - Effect: Allow
              Action: ec2:TerminateInstances
              # Terminate is scoped via tag-based ResourceTag condition so
              # the sweeper can only kill rebuild EC2s — not any other
              # workload that lands in the same account.
              Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
              Condition:
                StringEquals:
                  ec2:ResourceTag/Project: discogs-rebuild
            - Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: '*'
              Condition:
                StringEquals:
                  cloudwatch:namespace: WXYC/DiscogsRebuild
      Events:
        Hourly:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: Sweep stale rebuild EC2s.

  SweeperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SweeperFunction}
      RetentionInDays: 30

  # ------------------------------------------------------------------
  # Alerting. SNS topic + alarms on (a) the launcher Lambda crashing
  # before RunInstances, (b) the sweeper firing (= stuck rebuild).
  # ------------------------------------------------------------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: discogs-rebuild-alerts
      DisplayName: WXYC Discogs Rebuild Alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  LauncherErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: discogs-rebuild-launcher-errors
      AlarmDescription: Launcher Lambda crashed before RunInstances completed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref LauncherFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  StaleInstanceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: discogs-rebuild-stale-instance
      AlarmDescription: >
        Sweeper had to force-terminate a rebuild instance — bootstrap
        likely panicked before reaching shutdown -h now. Investigate the
        rebuild log in s3://wxyc-discogs-rebuild-logs-<account>/<instance-id>/.
      Namespace: WXYC/DiscogsRebuild
      MetricName: StaleInstanceTerminated
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # #358: the 2026-06-04 / 2026-07-07 / 2026-08-04 cache collapses (#352)
  # were all release_count cliffs that nothing alarmed on. cache_health_metrics.py
  # (invoked daily by sync-library.yml) publishes release_count to
  # WXYC/DiscogsCache with no Dimensions key, so the plain simple-form alarm
  # works directly — no dimensionless companion metric needed (see the org
  # CLAUDE.md CloudWatch conventions on when a companion is and isn't
  # warranted). Static floor rather than ANOMALY_DETECTION_BAND: the account
  # migration (#353) reset the org-account series to no history, so a band
  # would be untrustworthy for its first weeks. See ReleaseCountAlarmThreshold
  # for the floor's formula and provisional-default rationale.
  ReleaseCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: discogs-rebuild-release-count-floor
      AlarmDescription: >
        release_count dropped below ReleaseCountAlarmThreshold — the cache
        likely lost a large share of its rows (see #352 for the incident
        class: a colliding rebuild truncating and only partially reloading
        `release`). Investigate before assuming legitimate library churn:
        compare against the prior successful run and check
        s3://wxyc-discogs-rebuild-logs-<account>/ for the most recent
        rebuild log.
      Namespace: WXYC/DiscogsCache
      MetricName: release_count
      # Minimum, not Maximum: sync-library.yml also carries workflow_dispatch,
      # so a day can hold more than one sample. If any sample that day saw a
      # collapsed table, that is the reading worth paging on — a false page
      # from a manual re-run landing mid-rebuild is a cheaper mistake than
      # averaging a real collapse away.
      Statistic: Minimum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: !Ref ReleaseCountAlarmThreshold
      ComparisonOperator: LessThanThreshold
      # `missing`, NOT `notBreaching` — the opposite of the sibling alarms
      # above, deliberately. Theirs count events (an absent AWS/Lambda Errors
      # datapoint really does mean zero errors); this one is a gauge, where an
      # absent datapoint means "we could not count the cache", not "the cache
      # is fine". Both failure modes produce exactly that absence: the metric
      # publisher runs `COUNT(*) FROM release`, which raises UndefinedTable
      # when a colliding rebuild has dropped the table mid-swap, and the whole
      # publish chain in sync-library.yml is `if: success()`, so any earlier
      # step failing skips it. Under notBreaching each of those days scores as
      # healthy and the alarm sits in OK straight through the incident it
      # exists to catch — and, with OKActions attached, sends a false all-clear
      # on the day after a real firing. `missing` holds the last known state
      # instead, and reads INSUFFICIENT_DATA before the first publish, which is
      # the behavior infra/bootstrap/README.md already documents for this alarm.
      TreatMissingData: missing
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

Outputs:
  LauncherFunctionArn:
    Value: !GetAtt LauncherFunction.Arn
  SweeperFunctionArn:
    Value: !GetAtt SweeperFunction.Arn
  LaunchTemplateId:
    Value: !Ref LaunchTemplate
  LogBucketName:
    Value: !Ref LogBucket
  AlertTopicArn:
    Value: !Ref AlertTopic
    Description: Subscribe additional endpoints (Slack webhook via Lambda, PagerDuty, etc.) to this topic.
  InstanceRoleArn:
    Value: !GetAtt InstanceRole.Arn
