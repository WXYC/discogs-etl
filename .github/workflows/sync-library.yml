name: Sync Library

on:
  schedule:
    # Daily at noon UTC (7 AM EST / 8 AM EDT)
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      backend_catalog_url:
        description: "Backend catalog base URL to build from"
        default: "https://api.wxyc.org"
        required: false

# Workflow-level GITHUB_TOKEN scope. No job in this file pushes code,
# comments on PRs, or creates releases; all writes to external services
# use their own non-GITHUB_TOKEN secrets. contents:read is the safe floor.
# id-token:write is required for OIDC against AWS in the cache-health step.
permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # WXYC/discogs-etl#346 removed three steps from here: a MariaDB client
      # install, webfactory/ssh-agent, and an ssh-keyscan of the Kattare host.
      # All three existed only to reach tubafrenzy's MySQL, which this job no
      # longer reads -- the catalog now comes from Backend-Service over HTTP
      # (see the "Run library sync" step's BACKEND_CATALOG_* env). They are
      # still present in catalog-parity.yml, which is the one remaining MySQL
      # reader and retires with the Kattare host on 2026-09-22.

      - name: Set up streaming links enrichment
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/WXYC/library-metadata-lookup.git /tmp/library-metadata-lookup
          # streaming_availability.db is read from the Railway volume (the canonical
          # copy, LML#672), not the GitHub Release. Hard-fail on a non-200 or an
          # empty/invalid file: a naive `curl -o` exits 0 on HTTP 404/500 and writes
          # the error body, which would silently strip all streaming links from prod.
          # On a Railway outage the step aborts and prod keeps yesterday's library.db.
          dest=/tmp/library-metadata-lookup/streaming_availability.db
          http_code=$(curl -sS -w '%{http_code}' -o "$dest" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            "$PRODUCTION_URL/admin/download-streaming-db")
          if [ "$http_code" != "200" ]; then
            echo "::error::download-streaming-db returned HTTP $http_code"
            head -c 2000 "$dest" || true
            exit 1
          fi
          if [ ! -s "$dest" ]; then
            echo "::error::downloaded streaming_availability.db is empty"
            exit 1
          fi
          python -c "import sqlite3,sys; n=sqlite3.connect(sys.argv[1]).execute('SELECT count(*) FROM albums').fetchone()[0]; print('volume streaming_availability.db OK: %d albums' % n); sys.exit(0 if n>0 else 'downloaded streaming_availability.db has 0 albums')" "$dest"
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}

      # WXYC/discogs-etl#339: scripts/build_compilation_track_location.py (run
      # at the end of sync-library.sh, below) imports LML's own application
      # package and third-party dependencies (aiosqlite, asyncpg, fastapi,
      # wxyc_etl, ...) that this repo's own Python environment does not carry.
      # Without a venv here, sync-library.sh's $LML_DIR/.venv/bin/python check
      # falls through to this repo's own interpreter, which import-fails and
      # trips the script's soft-fail WARN-and-continue branch -- the build
      # silently produces zero rows every day (the bug this step fixes).
      # Mirrors the venv provisioning in rebuild-cache.yml's "Rebuild
      # compilation-track recall index (full)" step for consistency.
      #
      # Best-effort, like the build step itself: this runs *before* "Run
      # library sync" below, so a hard failure here (GitHub Actions skips
      # subsequent steps after a failed one by default) would silently take
      # the core library.db sync/upload down with it. Never let that happen --
      # on any provisioning error, warn and continue; sync-library.sh's own
      # $LML_DIR/.venv/bin/python check then falls back to its pre-existing
      # WARN-and-continue soft-fail path for the build itself.
      - name: Provision LML venv for compilation-track recall index build
        run: |
          set +e
          python3 -m venv /tmp/library-metadata-lookup/.venv \
            && /tmp/library-metadata-lookup/.venv/bin/pip install --quiet -e /tmp/library-metadata-lookup
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Failed to provision LML venv (exit $rc); the compilation-track recall index build will fall back to this job's own interpreter and soft-fail inside sync-library.sh -- the library.db sync/upload is unaffected"
          fi

      # #344: the sync now runs scripts/derive_va_release.py, which imports
      # psycopg -- absent from the bare setup-python interpreter this job
      # runs the sync with (every other sync-path script is stdlib-only, and
      # lib.observability degrades to basicConfig without wxyc_etl, so
      # psycopg is the derive's ONLY missing dependency). Deliberately a
      # minimal install, not this repo's full editable [dev] install (which
      # stays after the sync, where a resolver failure can only cost the
      # metrics step), and deliberately soft-fail like the LML venv step
      # above: a pip failure here must never take the core library.db
      # sync/upload down -- on failure the derive just hits its designed
      # ModuleNotFoundError WARN inside sync-library.sh.
      - name: Install psycopg for the va_release derive step
        run: |
          set +e
          pip install --quiet "psycopg[binary]>=3.1"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Failed to install psycopg (exit $rc); the va_release derive step will soft-fail inside sync-library.sh -- the library.db sync/upload is unaffected"
          fi

      - name: Run library sync
        run: scripts/sync-library.sh
        env:
          LML_REPO_DIR: /tmp/library-metadata-lookup
          LIBRARY_DB_OUTPUT: /tmp/library.db
          # The catalog source (#346). The service-account credentials below
          # are deliberately the same secrets catalog-parity.yml uses -- one
          # account (catalog-parity@wxyc.invalid, #365) reads the Backend
          # catalog export for both the soak and this build, and a
          # tests/unit/test_sync_library_backend_source.py guard holds the two
          # in lockstep so a rotation cannot land on only one of them.
          #
          # The URL is the one name deliberately NOT shared with the soak. The
          # soak reads a repo-level `vars.BACKEND_CATALOG_URL` so an operator
          # can aim a dispatch at staging; a repo variable outlives the run
          # that set it, so the same wiring here would let a forgotten staging
          # override silently redirect the next SCHEDULED run -- production's
          # library.db built from staging's catalog and uploaded to production
          # LML, nothing failing, a log line the only evidence. On the soak a
          # stale override costs a wasted run; here it costs the catalog. A
          # per-dispatch input cannot outlive its run, and `inputs.*` is empty
          # on a cron tick, so a scheduled build always resolves to the
          # literal production URL below.
          BACKEND_CATALOG_URL: ${{ inputs.backend_catalog_url || 'https://api.wxyc.org' }}
          # The service account's password, not a token: the JWT Backend
          # accepts expires in 15 minutes, so the build signs in per run.
          BACKEND_CATALOG_EMAIL: ${{ secrets.BACKEND_CATALOG_EMAIL }}
          BACKEND_CATALOG_PASSWORD: ${{ secrets.BACKEND_CATALOG_PASSWORD }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          STAGING_URL: ${{ secrets.STAGING_URL }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          # Optional: when SENTRY_DSN is set, scripts/build_library_db.py and
          # the other Python entrypoints invoked by sync-library.sh hand exception
          # events to Sentry via wxyc_etl.logger. Unset → Sentry stays inactive,
          # JSON logging still emits to stderr.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # WXYC/discogs-etl#339: the incremental compilation_track_location build
          # (scripts/build_compilation_track_location.py, run at the end of
          # sync-library.sh) reads these via LML's own config.settings -- PG
          # connection for lml_cache.compilation_track_location + the discogs-cache
          # tables it matches against, and the Discogs token for the artwork
          # precompute. Both already exist as repo secrets (used elsewhere in this
          # workflow / in rebuild-cache.yml).
          DATABASE_URL_DISCOGS: ${{ secrets.DATABASE_URL_DISCOGS }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          # #344: operator knob for the va_release derive's row-count floor
          # (docs/automation.md). Set the repo Actions variable to raise it
          # once a prod baseline exists; unset/empty falls back to the
          # script's default of 1.
          VA_RELEASE_FLOOR: ${{ vars.VA_RELEASE_FLOOR || '' }}

      - name: Update library.db in LML release
        if: success()
        run: |
          gh release upload streaming-data-v1 /tmp/library.db --clobber --repo WXYC/library-metadata-lookup
        env:
          GH_TOKEN: ${{ secrets.LML_RELEASE_TOKEN }}

      # Per WXYC/discogs-etl#241: publish artwork-state counts to CloudWatch
      # so the never-asked share has a time series we can alarm on. Runs
      # daily alongside the library sync (same cadence the issue recommends).
      - uses: aws-actions/configure-aws-credentials@v6
        if: success()
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Install discogs-etl
        if: success()
        run: pip install -e ".[dev]"

      - name: Publish cache-health metrics
        if: success()
        run: python scripts/cache_health_metrics.py
        env:
          DATABASE_URL_DISCOGS: ${{ secrets.DATABASE_URL_DISCOGS }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      # This job writes production's catalog every day and, until #346, had no
      # failure path at all: no notifier step, no webhook in env. The 09-15 and
      # 09-16 runs both failed on the shared host's connection ceiling and LML
      # served a two-day-stale library.db until a human noticed -- which is the
      # failure mode this closes.
      #
      # Copied from rebuild-cache.yml's notifier, including the part that matters
      # most: when SLACK_MONITORING_WEBHOOK is unset this step FAILS rather than
      # skipping quietly, so "nobody is listening" cannot itself be the thing that
      # falls silent (#219). Note the secret is not currently set on this repo, so
      # until it is, that annotation is the alert.
      #
      # A workflow step rather than the script's own --notify: this also catches
      # what the script cannot see -- the checkout, the streaming-db download, the
      # release upload, a runner death mid-run.
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MONITORING_WEBHOOK }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::error::SLACK_MONITORING_WEBHOOK is not set in repo secrets. The daily library sync failed but no Slack alert was posted, so production LML is serving a stale library.db with no signal. Configure the secret per docs/automation.md 'Library Sync' -> 'Required GitHub secrets'. Failing this notifier step so the workflow's overall status stays red."
            exit 1
          fi
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\":warning: *Daily library sync failed*\nProduction LML keeps yesterday's library.db until this is re-run.\nRun: $RUN_URL\"}" \
            || true
